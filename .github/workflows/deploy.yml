name: Deploy Drupal

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Unique user ID'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure with device code
        run: |
          az login --use-device-code
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create ACR if not exists
        run: |
          if ! az acr show --name drupalacrnarjes --resource-group drupal-rg-user1-5ad1bbb1 > /dev/null 2>&1; then
            az acr create \
              --resource-group drupal-rg-user1-5ad1bbb1 \
              --name drupalacrnarjes \
              --sku Basic \
              --admin-enabled true
          fi
          ACR_USERNAME=$(az acr credential show --name drupalacrnarjes --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name drupalacrnarjes --query passwords[0].value -o tsv)
          echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV

    
      - name: Build and Push Drupal Image
        run: |
          TIMESTAMP=$(date +%s)
          IMAGE_NAME="drupalacrnarjes.azurecr.io/drupal:$TIMESTAMP"
          docker build -t $IMAGE_NAME .
          echo "$ACR_PASSWORD" | docker login drupalacrnarjes.azurecr.io --username "$ACR_USERNAME" --password-stdin
          docker push $IMAGE_NAME
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Deploy Drupal to ACI with Existing Database
        run: |
          INSTANCE_ID=$(date +"%Y%m%d%H%M%S")
          CONTAINER_NAME="drupal-${{ github.event.inputs.user_id }}-$INSTANCE_ID"
          az container create \
            --resource-group drupal-rg-user1-5ad1bbb1 \
            --name $CONTAINER_NAME \
            --image ${{ env.IMAGE_NAME }} \
            --dns-name-label drupal-${{ github.event.inputs.user_id }}-$INSTANCE_ID-narjes \
            --ports 80 \
            --os-type Linux \
            --environment-variables \
              DRUPAL_DB_HOST=drupal-db-user1-5ad1bbb1.mysql.database.azure.com \
              DRUPAL_DB_NAME=drupaldb-user1 \
              DRUPAL_DB_USER=drupaluser_user1 \
              DRUPAL_DB_PASSWORD=xr4u8WSiq3B!TQOL \
              DRUPAL_ADMIN_USERNAME=admin \
              DRUPAL_ADMIN_PASSWORD=admin \
              DRUPAL_SITE_NAME="Drupal Site ${{ github.event.inputs.user_id }}" \
              DRUPAL_DB_PREFIX="user_${{ github.event.inputs.user_id }}_${INSTANCE_ID}_" \
            --registry-login-server drupalacrnarjes.azurecr.io \
            --registry-username "$ACR_USERNAME" \
            --registry-password "$ACR_PASSWORD" \
            --memory 4 \
            --cpu 2
          echo "Waiting for container to start (60 seconds)..."  # Réduit de 120 à 60
          sleep 60
          echo "Checking container logs..."
          az container logs --resource-group drupal-rg-user1-5ad1bbb1 --name $CONTAINER_NAME || echo "Failed to retrieve logs"
          echo "Checking container status..."
          az container show --resource-group drupal-rg-user1-5ad1bbb1 --name $CONTAINER_NAME --query "provisioningState"
          echo "Drupal site URL: http://drupal-${{ github.event.inputs.user_id }}-$INSTANCE_ID-narjes.centralus.azurecontainer.io"

      
