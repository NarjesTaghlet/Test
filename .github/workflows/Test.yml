name: Deploy Drupal on ACI with Persistent Storage and Database

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'User ID for unique resource naming'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Storage Account and File Share (if not exists)
        id: create_storage
        run: |
          STORAGE_ACCOUNT_NAME="drupalstorage${{ github.event.inputs.user_id }}"
          FILE_SHARE_NAME="drupal-files-${{ github.event.inputs.user_id }}"
          RESOURCE_GROUP="drupal-rg-user1-5ad1bbb1"

          # Create storage account if it doesn't exist
          if ! az storage account show --name $STORAGE_ACCOUNT_NAME --resource-group $RESOURCE_GROUP --query name -o tsv 2>/dev/null; then
            az storage account create \
              --name $STORAGE_ACCOUNT_NAME \
              --resource-group $RESOURCE_GROUP \
              --location centralus \
              --sku Standard_LRS
            echo "Created storage account: $STORAGE_ACCOUNT_NAME"
          fi

          # Get storage account key
          STORAGE_KEY=$(az storage account keys list --account-name $STORAGE_ACCOUNT_NAME --resource-group $RESOURCE_GROUP --query '[0].value' -o tsv)

          # Create file share if it doesn't exist
          if ! az storage share-rm exists --storage-account $STORAGE_ACCOUNT_NAME --name $FILE_SHARE_NAME --query exists -o tsv | grep -q true; then
            az storage share-rm create \
              --storage-account $STORAGE_ACCOUNT_NAME \
              --name $FILE_SHARE_NAME \
              --quota 1024 \
              --enabled-protocols SMB
            echo "Created file share: $FILE_SHARE_NAME"
          fi

          # Export variables for later steps
          echo "STORAGE_ACCOUNT_NAME=$STORAGE_ACCOUNT_NAME" >> $GITHUB_ENV
          echo "FILE_SHARE_NAME=$FILE_SHARE_NAME" >> $GITHUB_ENV
          echo "STORAGE_KEY=$STORAGE_KEY" >> $GITHUB_ENV

      - name: Create Azure Database for MySQL (if not exists)
        id: create_db
        run: |
          DB_NAME="drupaldb${{ github.event.inputs.user_id }}"
          DB_SERVER_NAME="drupal-db-server-${{ github.event.inputs.user_id }}"
          RESOURCE_GROUP="drupal-rg-user1-5ad1bbb1"
          DB_USER="drupaluser"
          DB_PASSWORD="$(openssl rand -base64 16)"

          # Create MySQL server if it doesn't exist
          if ! az mysql server show --name $DB_SERVER_NAME --resource-group $RESOURCE_GROUP --query name -o tsv 2>/dev/null; then
            az mysql server create \
              --name $DB_SERVER_NAME \
              --resource-group $RESOURCE_GROUP \
              --location centralus \
              --admin-user $DB_USER \
              --admin-password $DB_PASSWORD \
              --sku-name B_Gen5_1 \
              --storage-size 5120
            echo "Created MySQL server: $DB_SERVER_NAME"
          fi

          # Create database if it doesn't exist
          if ! az mysql db show --name $DB_NAME --server-name $DB_SERVER_NAME --resource-group $RESOURCE_GROUP --query name -o tsv 2>/dev/null; then
            az mysql db create \
              --name $DB_NAME \
              --server-name $DB_SERVER_NAME \
              --resource-group $RESOURCE_GROUP
            echo "Created database: $DB_NAME"
          fi

          # Export variables for later steps
          echo "DB_NAME=$DB_NAME" >> $GITHUB_ENV
          echo "DB_SERVER_NAME=$DB_SERVER_NAME" >> $GITHUB_ENV
          echo "DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

      - name: Deploy Drupal on Azure Container Instances (ACI)
        run: |
          RESOURCE_GROUP="drupal-rg-user1-5ad1bbb1"
          CONTAINER_NAME="drupal-container-${{ github.event.inputs.user_id }}"
          STORAGE_ACCOUNT_NAME="${{ env.STORAGE_ACCOUNT_NAME }}"
          FILE_SHARE_NAME="${{ env.FILE_SHARE_NAME }}"
          STORAGE_KEY="${{ env.STORAGE_KEY }}"
          DB_NAME="${{ env.DB_NAME }}"
          DB_SERVER_NAME="${{ env.DB_SERVER_NAME }}"
          DB_USER="${{ env.DB_USER }}"
          DB_PASSWORD="${{ env.DB_PASSWORD }}"

          az container create \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_NAME \
            --image drupal:latest \
            --ports 80 \
            --dns-name-label $CONTAINER_NAME \
            --azure-file-volume-account-name $STORAGE_ACCOUNT_NAME \
            --azure-file-volume-account-key $STORAGE_KEY \
            --azure-file-volume-share-name $FILE_SHARE_NAME \
            --azure-file-volume-mount-path /var/www/html/sites/default/files \
            --environment-variables \
             DRUPAL_DB_HOST=drupal-db-user1-5ad1bbb1.mysql.database.azure.com \
              DRUPAL_DB_NAME=${{ env.DB_NAME }} \
              DRUPAL_DB_USER=${{ secrets.DB_USER }} \
              DRUPAL_DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              DRUPAL_ADMIN_USERNAME=admin \
              DRUPAL_ADMIN_PASSWORD=admin \
              DRUPAL_SITE_NAME="Drupal Site ${{ github.event.inputs.user_id }}" \
              DRUPAL_DB_PREFIX="user_${{ github.event.inputs.user_id }}_${INSTANCE_ID}_" \
            --restart-policy Always
